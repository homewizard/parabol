{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parabol.postgres.fullname" . }}
  labels:
    {{- include "parabol.labels" . | nindent 4 }}
  annotations:
    # Keep across upgrades/uninstalls - Postgres only applies
    # POSTGRES_PASSWORD on first init of an empty data directory, so
    # rotating this without also wiping the PVC breaks connectivity.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_PASSWORD: {{ include "parabol.postgres.password" . | quote }}
{{- end }}
{{- end }}
