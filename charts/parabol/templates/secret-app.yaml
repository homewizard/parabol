apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parabol.fullname" . }}
  labels:
    {{- include "parabol.labels" . | nindent 4 }}
  annotations:
    # Keep this Secret across upgrades/uninstalls - regenerating
    # SERVER_SECRET would invalidate every signed session/token.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SERVER_SECRET: {{ include "parabol.serverSecret" . | quote }}
  POSTGRES_PASSWORD: {{ include "parabol.postgres.password" . | quote }}
  {{- range $k, $v := .Values.parabol.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
