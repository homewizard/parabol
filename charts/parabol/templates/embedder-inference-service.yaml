{{- if .Values.embedder.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parabol.embedderInference.fullname" . }}
  labels:
    {{- include "parabol.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedder-inference
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.embedder.inference.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "parabol.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: embedder-inference
{{- end }}
