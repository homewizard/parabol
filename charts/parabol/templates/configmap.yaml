{{- $auth := .Values.parabol.env.auth }}
{{- if not (or $auth.internal.enabled $auth.google.enabled $auth.microsoft.enabled) }}
{{- fail "At least one of parabol.env.auth.internal.enabled, parabol.env.auth.google.enabled, parabol.env.auth.microsoft.enabled must be true, or nobody will be able to log in." }}
{{- end }}
{{- if $auth.google.enabled }}
{{- if not $auth.google.clientId }}
{{- fail "parabol.env.auth.google.clientId is required when parabol.env.auth.google.enabled=true" }}
{{- end }}
{{- if not (or .Values.parabol.secrets.auth.google.clientSecret .Values.parabol.secrets.auth.google.existingSecret) }}
{{- fail "parabol.secrets.auth.google.clientSecret or .existingSecret is required when parabol.env.auth.google.enabled=true" }}
{{- end }}
{{- end }}
{{- if $auth.microsoft.enabled }}
{{- if not $auth.microsoft.clientId }}
{{- fail "parabol.env.auth.microsoft.clientId is required when parabol.env.auth.microsoft.enabled=true" }}
{{- end }}
{{- if not (or .Values.parabol.secrets.auth.microsoft.clientSecret .Values.parabol.secrets.auth.microsoft.existingSecret) }}
{{- fail "parabol.secrets.auth.microsoft.clientSecret or .existingSecret is required when parabol.env.auth.microsoft.enabled=true" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "parabol.fullname" . }}
  labels:
    {{- include "parabol.labels" . | nindent 4 }}
data:
  HOST: {{ .Values.parabol.env.host | quote }}
  PORT: {{ .Values.parabol.containerPort | quote }}
  PROTO: {{ .Values.parabol.env.proto | quote }}
  AUTH_INTERNAL_DISABLED: {{ not $auth.internal.enabled | quote }}
  AUTH_GOOGLE_DISABLED: {{ not $auth.google.enabled | quote }}
  AUTH_MICROSOFT_DISABLED: {{ not $auth.microsoft.enabled | quote }}
  {{- if $auth.google.enabled }}
  GOOGLE_OAUTH_CLIENT_ID: {{ $auth.google.clientId | quote }}
  {{- end }}
  {{- if $auth.microsoft.enabled }}
  MICROSOFT_TENANT_ID: {{ $auth.microsoft.tenantId | quote }}
  MICROSOFT_CLIENT_ID: {{ $auth.microsoft.clientId | quote }}
  {{- end }}
  POSTGRES_USER: {{ .Values.postgres.auth.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_PORT: {{ .Values.postgres.service.port | quote }}
  POSTGRES_USE_PGVECTOR: "true"
  FILE_STORE_PROVIDER: {{ .Values.parabol.env.fileStoreProvider | quote }}
  CDN_BASE_URL: {{ .Values.parabol.env.cdnBaseUrl | quote }}
  MAIL_PROVIDER: {{ .Values.parabol.env.mailProvider | quote }}
  ENABLE_METRICS: {{ .Values.parabol.env.enableMetrics | quote }}
  METRICS_PORT: {{ .Values.parabol.env.metricsPort | quote }}
  IS_ENTERPRISE: {{ .Values.parabol.env.isEnterprise | quote }}
  IS_SINGLE_ORG: {{ .Values.parabol.env.isSingleOrg | quote }}
  CHRONOS_BATCH_EMAILS: {{ .Values.parabol.env.chronos.batchEmails | quote }}
  CHRONOS_SCHEDULE_JOBS: {{ .Values.parabol.env.chronos.scheduleJobs | quote }}
  CHRONOS_UPDATE_TOKENS: {{ .Values.parabol.env.chronos.updateTokens | quote }}
  CHRONOS_PROCESS_RECURRENCE: {{ .Values.parabol.env.chronos.processRecurrence | quote }}
  CHRONOS_AUTOPAUSE: {{ .Values.parabol.env.chronos.autopause | quote }}
  CHRONOS_PRUNE_PG: {{ .Values.parabol.env.chronos.prunePg | quote }}
  {{- range $k, $v := .Values.parabol.env.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
